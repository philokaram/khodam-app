<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>غير متصل — حضور الخدام</title>
<style>
body {
    font-family: 'Cairo', Tahoma, sans-serif;
    background: #E6F4EF;
    color: #0E3B34;
    display: grid;
    place-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    text-align: center;
}
.box {
    background: #fff;
    border: 2px solid #0E3B34;
    border-radius: 20px;
    padding: 40px 30px;
    box-shadow: 4px 4px 0 #0E3B34;
    max-width: 400px;
}
.icon { font-size: 64px; margin-bottom: 16px; }
h1 { font-size: 24px; margin: 0 0 12px; font-weight: 900; }
p { color: #4F7068; margin: 0 0 20px; }
button {
    background: #FFD23F;
    color: #0E3B34;
    border: 2px solid #0E3B34;
    border-radius: 14px;
    padding: 12px 28px;
    font: inherit;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 4px 4px 0 #0E3B34;
}
button:active { transform: translate(4px, 4px); box-shadow: 0 0 0; }
</style>
</head>
<body>
<div class="box">
    <div class="icon">📡</div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>يرجى التحقق من اتصالك ثم إعادة المحاولة.</p>
    <button onclick="location.reload()">إعادة المحاولة</button>
</div>
</body>
</html>
